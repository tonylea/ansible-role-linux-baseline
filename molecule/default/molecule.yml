dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: debian-trixie
    image: debian:trixie-20261104
    dockerfile: Dockerfile.j2
    pre_build_image: false
    # systemd runs as PID 1, so services, timedatectl and chrony behave as on a real machine.
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw
      /tmp: rw

provisioner:
  name: ansible
  inventory:
    host_vars:
      debian-trixie:
        linux_baseline_sudo_user: deploy

verifier:
  name: ansible
