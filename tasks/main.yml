- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    autoremove: true

- name: Install packages
  ansible.builtin.apt:
    name: "{{ linux_baseline_packages + ['chrony', 'locales', 'unattended-upgrades'] }}"
    state: present

- name: Set the timezone
  community.general.timezone:
    name: "{{ linux_baseline_timezone }}"

- name: Generate the locale
  community.general.locale_gen:
    name: "{{ linux_baseline_locale }}"
    state: present

- name: Set the default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG={{ linux_baseline_locale }}
    owner: root
    group: root
    mode: "0644"

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Keep time with chrony
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Turn on unattended security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Never reboot after unattended updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-no-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Give the login user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ linux_baseline_sudo_user }}
    content: |
      {{ linux_baseline_sudo_user }} ALL=(ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
